# Pull-request checks are routed by the behavior they prove. Package consumers
# do not inherit their dependencies' test suites; main and manual runs execute
# every contract regardless of these paths.
routing:
  - ".github/ci-paths.yml"

workspace:
  - ".mise.toml"
  - ".tool-versions"
  - "package.json"
  - "package-lock.json"
  - "patches/**"
  - "scripts/**"
  - "tsconfig.json"
  - "tsconfig.base.json"
  - "vitest.config.ts"

ci:
  - ".github/actions/**"
  - ".github/workflows/ci.yml"

format:
  - ".agents/**/*.{cjs,css,html,js,json,jsonc,jsx,md,mjs,ts,tsx,yaml,yml}"
  - ".github/**/*.{cjs,css,html,js,json,jsonc,jsx,md,mjs,ts,tsx,yaml,yml}"
  - "**/*.{cjs,css,html,js,json,jsonc,jsx,md,mjs,ts,tsx,yaml,yml}"

quality:
  - "**/*.{cjs,js,json,jsx,mjs,ts,tsx}"

hub:
  - "packages/cli/src/commands/hub/**"
  - "packages/server/src/server/hub/**"

server:
  - "plugins/**"
  - "packages/server/**"

desktop:
  - "packages/desktop/**"
  - "packages/server/src/server/browser-tools/**"

# The bun workspace's bridge imports the workspace builds of client, protocol,
# and server's local-credential module by path, so their sources change its
# typecheck and tests. apps/web also imports the repo CHANGELOG at build time.
desktop_web:
  - "packages/desktop-web/**"
  - "packages/client/**"
  - "packages/protocol/**"
  - "packages/relay/**"
  - "packages/server/src/server/local-credential.ts"
  - "CHANGELOG*.md"

# The browser suite in packages/server drives the built desktop-web page, so a change
# to either side (or the workspace builds that page consumes) invalidates it.
desktop_web_real_daemon:
  - "packages/desktop-web/**"
  - "packages/server/**"
  - "packages/client/**"
  - "packages/protocol/**"
  - "packages/relay/**"
  - "scripts/build-daemon-web-app.mjs"
  - "CHANGELOG*.md"

sdk:
  - "packages/plugin/**"
  - "plugin-examples/**"
  - "public-docs/plugins/**"
  - "packages/client/**"
  - "packages/highlight/**"
  - "packages/protocol/**"

relay:
  - "packages/relay/**"

cli:
  - "packages/cli/**"
