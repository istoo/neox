name: CI

on:
  push:
    branches: [main]
  # Every base branch, so stacked PRs and PRs into any base get the same checks.
  pull_request:
  merge_group:
  workflow_dispatch:

# A newer push to the same ref cancels the run still in progress, main included.
# A full run costs about 200 runner-minutes against the org's 20 concurrent
# jobs, and a superseded main run only answers a question the newer commit
# answers again.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI does not use the CUDA execution provider, and the onnxruntime-node
  # postinstall download from NuGet is large enough to make npm ci flaky.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      full: ${{ github.event_name != 'pull_request' || steps.filter.outputs.routing != 'false' || steps.filter.outputs.workspace != 'false' || steps.filter.outputs.ci != 'false' }}
      format: ${{ steps.filter.outputs.format }}
      quality: ${{ steps.filter.outputs.quality }}
      hub: ${{ steps.filter.outputs.hub }}
      server: ${{ steps.filter.outputs.server }}
      desktop: ${{ steps.filter.outputs.desktop }}
      desktop_web: ${{ steps.filter.outputs.desktop_web }}
      desktop_web_real_daemon: ${{ steps.filter.outputs.desktop_web_real_daemon }}
      sdk: ${{ steps.filter.outputs.sdk }}
      relay: ${{ steps.filter.outputs.relay }}
      cli: ${{ steps.filter.outputs.cli }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Detect affected CI contracts
        id: filter
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        with:
          filters: .github/ci-paths.yml

      - name: Validate CI contracts
        run: node --test scripts/ci-workflow.test.mjs scripts/daemon-launch-contract.test.mjs scripts/embed-bundle-guard.test.mjs scripts/generate-third-party-notices.test.mjs scripts/upload-release-assets.test.mjs

  quality:
    name: quality
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.format != 'false' || needs.changes.outputs.quality != 'false' || needs.changes.outputs.relay != 'false' || needs.changes.outputs.sdk != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        id: install
        run: node scripts/npm-retry.mjs ci

      # Explicit status checks keep independent domains running after a failure.
      # A failed step still fails quality; no continue-on-error or success shim.
      - name: Check formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.format != 'false') }}
        run: npm run format:check

      - name: Lint lockfile
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.quality != 'false') }}
        run: npx --yes lockfile-lint --path package-lock.json --type npm --allowed-hosts npm --validate-https --validate-integrity

      - name: Verify dependency signatures
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.quality != 'false') }}
        run: npm audit signatures

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.quality != 'false') }}
        run: npm run lint

      - name: Test lint rules
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.quality != 'false') }}
        run: node --test scripts/oxlint/neolix-plugin.test.mjs

      - name: Build relay
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.relay != 'false') }}
        run: npm run build:relay

      - name: Run relay tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.relay != 'false') }}
        run: npm run test --workspace=@neolix/relay

      - name: Build client dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.sdk != 'false') }}
        run: npm run build:relay && npm run build:client

      - name: Build plugin SDK
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.sdk != 'false') }}
        run: npm run build:plugin

      - name: Run plugin SDK tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.sdk != 'false') }}
        run: npm run test --workspace=@neolix/plugin

      - name: Run protocol tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.sdk != 'false') }}
        run: npm run test --workspace=@neolix/protocol

      - name: Run client tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.sdk != 'false') }}
        run: npm run test --workspace=@neolix/client

      - name: Run highlight tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.sdk != 'false') }}
        run: npm run test --workspace=@neolix/highlight

      - name: Typecheck client examples
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.sdk != 'false') }}
        run: npm run typecheck:examples --workspace=@neolix/client

  typecheck:
    name: typecheck
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.quality != 'false') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Verify dependency patch recovery
        run: node --test scripts/postinstall-patches.test.mjs

      - name: Build server stack
        run: npm run build:server

      - name: Verify built-in plugins from built output
        run: node --test scripts/builtin-plugins-dist.test.mjs

      - name: Typecheck all packages
        run: npm run typecheck

      - name: Verify public package contents
        run: |
          npm pack --dry-run --ignore-scripts --workspace=@neolix/protocol
          npm pack --dry-run --ignore-scripts --workspace=@neolix/client
          npm pack --dry-run --ignore-scripts --workspace=@neolix/server

  server-tests-ubuntu:
    name: server-tests (ubuntu-latest)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.server != 'false' || needs.changes.outputs.hub != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - &server_capacity
        name: Log runner capacity
        run: |
          node -e "const os = require('node:os'); console.log(JSON.stringify({cpus: os.cpus().length, model: os.cpus()[0].model, ramGiB: os.totalmem() / 2 ** 30}))"

      - &server_checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - &server_node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - &server_fetch
        name: Fetch origin/main (worktree tests)
        if: ${{ needs.changes.outputs.full != 'false' || needs.changes.outputs.server != 'false' }}
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - &server_install
        name: Install dependencies
        run: node scripts/npm-retry.mjs ci

      - &server_agent_clis
        name: Install agent CLIs for provider tests
        if: ${{ needs.changes.outputs.full != 'false' || needs.changes.outputs.server != 'false' }}
        run: node scripts/npm-retry.mjs install -g @anthropic-ai/claude-code opencode-ai

      - &server_build
        name: Build server dependencies
        run: npm run build:server-deps

      - name: Run server tests
        if: ${{ needs.changes.outputs.full != 'false' || needs.changes.outputs.server != 'false' }}
        run: npm run test --workspace=@neolix/server
        env: &server_test_env
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - &server_plugin_tests
        name: Run built-in plugin tests
        if: ${{ needs.changes.outputs.full != 'false' || needs.changes.outputs.server != 'false' }}
        run: npm run test --workspace=@neolix/builtin-plugins

      - &server_hub_contract
        name: Run Hub CLI/daemon contract
        if: ${{ needs.changes.outputs.full == 'false' && needs.changes.outputs.server == 'false' && needs.changes.outputs.hub != 'false' }}
        run: npm run test:hub-cli-contract --workspace=@neolix/server

  server-tests-windows:
    name: server-tests (windows-latest)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.server != 'false' || needs.changes.outputs.hub != 'false') }}
    runs-on: windows-latest
    steps:
      - *server_capacity
      - *server_checkout
      - *server_node
      - *server_fetch
      - *server_install
      - *server_agent_clis
      - *server_build

      - name: Run server unit tests
        if: ${{ needs.changes.outputs.full != 'false' || needs.changes.outputs.server != 'false' }}
        run: npm run test:unit --workspace=@neolix/server
        env: *server_test_env

      - *server_plugin_tests
      - *server_hub_contract

  # Keep the serial integration chain off the Windows unit critical path.
  server-integration-windows:
    name: server-integration (windows-latest)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.server != 'false') }}
    runs-on: windows-latest
    steps:
      - *server_capacity
      - *server_checkout
      - *server_node
      - *server_fetch
      - *server_install
      - *server_agent_clis
      - *server_build

      - name: Run server integration tests
        run: npm run test:integration --workspace=@neolix/server
        env: *server_test_env

  # native-recursive.ts serves darwin and win32, but windows-latest above is the only
  # runner that exercises it. macOS — the platform the reported watcher bug was on —
  # otherwise has no server-test coverage. Scoped to the observer/watcher suites to
  # bound runtime.
  server-tests-macos:
    name: server-tests (macos-latest, file observation)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.server != 'false') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Build server dependencies
        run: npm run build:server-deps

      - name: Run file observation tests
        run: |
          npm run test:unit --workspace=@neolix/server -- \
            src/server/file-observer \
            src/server/workspace-git-service.observation.test.ts \
            src/server/workspace-git-service.observation.integration.test.ts \
            --bail=1

  desktop-tests-ubuntu:
    name: desktop-tests (ubuntu-latest)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.desktop != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps: &desktop_test_steps
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies with retry
        run: node scripts/npm-retry.mjs ci

      - name: Build server stack
        run: npm run build:server

      - name: Run desktop tests
        run: npm run test --workspace=@neolix/desktop

      - name: Install virtual display
        if: ${{ runner.os == 'Linux' }}
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth xdotool

      - name: Install Playwright browser
        if: ${{ runner.os == 'Linux' }}
        run: npx playwright install chromium

      - name: Verify Windows daemon process control
        if: ${{ runner.os == 'Windows' }}
        run: npx vitest run packages/cli/src/commands/daemon/lifecycle.e2e.test.ts --bail=1 --maxWorkers=1 -t "Windows unbound|managed two-home"

      - name: Run desktop lifecycle E2E (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: xvfb-run -a --server-args="-screen 0 1280x800x24" npm run test:e2e:lifecycle --workspace=@neolix/desktop
        env:
          NEOLIX_DESKTOP_LIFECYCLE_ARTIFACT_DIR: ${{ runner.temp }}/desktop-lifecycle

      - name: Upload desktop lifecycle screenshots
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        with:
          name: desktop-lifecycle
          path: ${{ runner.temp }}/desktop-lifecycle
          if-no-files-found: ignore
          retention-days: 7

      - name: Run desktop lifecycle E2E (Windows)
        if: ${{ runner.os == 'Windows' }}
        run: npm run test:e2e:lifecycle --workspace=@neolix/desktop

  desktop-tests-windows:
    name: desktop-tests (windows-latest)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.desktop != 'false') }}
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps: *desktop_test_steps

  # packages/desktop-web is a separate bun workspace. Its bridge imports the
  # root workspace builds by path, so build those before typechecking or testing.
  desktop-web-tests:
    name: desktop-web-tests (typecheck and unit)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.desktop_web != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Build bridge dependencies
        run: npm run build:server

      - name: Install desktop-web dependencies
        working-directory: packages/desktop-web
        run: bun install --frozen-lockfile

      - name: Typecheck contracts
        working-directory: packages/desktop-web/packages/contracts
        run: bun run typecheck

      - name: Typecheck client-runtime
        working-directory: packages/desktop-web/packages/client-runtime
        run: bun run typecheck

      - name: Run client-runtime unit tests
        working-directory: packages/desktop-web/packages/client-runtime
        run: bun run test

      - name: Typecheck bridge
        working-directory: packages/desktop-web/apps/bridge
        run: bun run typecheck

      - name: Typecheck web
        working-directory: packages/desktop-web/apps/web
        run: bun run typecheck

      - name: Run bridge tests
        working-directory: packages/desktop-web/apps/bridge
        run: bunx vitest run

      - name: Run web unit tests
        working-directory: packages/desktop-web/apps/web
        run: bunx vitest run

  # The CI vitest config splits the serial browser suite into measured projects.
  # One static job per project keeps every shard on the same runner image.
  desktop-web-browser-1:
    name: desktop-web-browser (shard 1/4)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.desktop_web != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      DESKTOP_WEB_BROWSER_PROJECT: chat-follow
    steps: &desktop_web_browser_steps
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - name: Install desktop-web dependencies
        working-directory: packages/desktop-web
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        working-directory: packages/desktop-web/apps/web
        run: bun run test:browser:install

      - name: Run web browser tests
        working-directory: packages/desktop-web/apps/web
        run: bunx vitest run --config vitest.browser.ci.config.ts --project="$DESKTOP_WEB_BROWSER_PROJECT"

  desktop-web-browser-2:
    name: desktop-web-browser (shard 2/4)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.desktop_web != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      DESKTOP_WEB_BROWSER_PROJECT: chat-projects
    steps: *desktop_web_browser_steps

  desktop-web-browser-3:
    name: desktop-web-browser (shard 3/4)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.desktop_web != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      DESKTOP_WEB_BROWSER_PROJECT: chat-workflows
    steps: *desktop_web_browser_steps

  desktop-web-browser-4:
    name: desktop-web-browser (shard 4/4)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.desktop_web != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      DESKTOP_WEB_BROWSER_PROJECT: components
    steps: *desktop_web_browser_steps

  # The only suite that drives the built desktop-web page with a real browser against
  # a real daemon: onboarding, projects, a streamed turn, reload, reconnect, settings,
  # History and Browser access. The in-process test daemon needs the web app build.
  desktop-web-e2e:
    name: desktop-web-e2e (real daemon and UI)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.desktop_web_real_daemon != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Build server
        run: npm run build:server

      - name: Install desktop-web dependencies
        working-directory: packages/desktop-web
        run: bun install --frozen-lockfile

      - name: Build the daemon web app
        run: npm run build:daemon-web-app

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run desktop web UI e2e
        run: npm run test:e2e:desktop-web --workspace=@neolix/server

  cli-tests-1:
    name: cli-tests (shard 1/3)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.cli != 'false') }}
    runs-on: ubuntu-latest
    env:
      NEOLIX_LOCAL_SPEECH_AUTO_DOWNLOAD: "0"
      NEOLIX_DICTATION_ENABLED: "0"
      NEOLIX_VOICE_MODE_ENABLED: "0"
      NEOLIX_CLI_TEST_SHARD: "1"
      NEOLIX_CLI_TEST_SHARD_TOTAL: "3"
    steps: &cli_test_steps
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Install agent CLIs for provider tests
        run: node scripts/npm-retry.mjs install -g @anthropic-ai/claude-code @openai/codex@0.105.0 opencode-ai

      # The local runner builds its dependencies and shards its own E2E files.
      - name: Run CLI E2E tests
        run: npm run test:local --workspace=@neolix/cli

      # Source tests do not read NEOLIX_CLI_TEST_SHARD. Run them once, on the
      # shortest E2E shard, after its runner has built the server stack.
      - name: Run CLI source tests
        if: ${{ env.NEOLIX_CLI_TEST_SHARD == '3' }}
        run: npm run test:unit --workspace=@neolix/cli

  cli-tests-2:
    name: cli-tests (shard 2/3)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.cli != 'false') }}
    runs-on: ubuntu-latest
    env:
      NEOLIX_LOCAL_SPEECH_AUTO_DOWNLOAD: "0"
      NEOLIX_DICTATION_ENABLED: "0"
      NEOLIX_VOICE_MODE_ENABLED: "0"
      NEOLIX_CLI_TEST_SHARD: "2"
      NEOLIX_CLI_TEST_SHARD_TOTAL: "3"
    steps: *cli_test_steps

  cli-tests-3:
    name: cli-tests (shard 3/3)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.cli != 'false') }}
    runs-on: ubuntu-latest
    env:
      NEOLIX_LOCAL_SPEECH_AUTO_DOWNLOAD: "0"
      NEOLIX_DICTATION_ENABLED: "0"
      NEOLIX_VOICE_MODE_ENABLED: "0"
      NEOLIX_CLI_TEST_SHARD: "3"
      NEOLIX_CLI_TEST_SHARD_TOTAL: "3"
    steps: *cli_test_steps
