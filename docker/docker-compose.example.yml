# Minimal Neolix daemon + web UI deployment.
#
# Open http://localhost:6868 after `docker compose up -d`.
# For any network-reachable deployment, change NEOLIX_PASSWORD first.
services:
  neolix:
    image: ghcr.io/istoo/neox:latest
    container_name: neolix
    restart: unless-stopped
    ports:
      - "6868:6868"
    environment:
      NEOLIX_PASSWORD: "change-me"
      # Add DNS names you use to reach this container. IPs and localhost are
      # already allowed by default.
      # NEOLIX_HOSTNAMES: "neox.example.com,.lan"
    volumes:
      # Persistent daemon state and agent credentials/config.
      - ./neox-home:/home/neolix
      # Code visible to Neolix and the agents it launches.
      - ./workspace:/workspace
