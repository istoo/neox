<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/neolix-favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/neolix-apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Web fonts are network-backed and non-essential for first paint. A plain
      render-blocking stylesheet would also hold back the deferred module
      script below (scripts wait for pending stylesheets), so an offline or
      captive network could leave the boot splash up until the request timed
      out. Preload keeps the fetch at normal priority without blocking, then
      `main.tsx` promotes the sheet (`data-promote-stylesheet`): an inline
      `onload` handler would need 'unsafe-hashes' in the bridge's CSP.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cal+Sans&family=DM+Sans:ital,opsz,wght@0,9..40,300..800;1,9..40,300..800&family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&family=Inter:opsz,wght@14..32,100..900&display=swap"
      rel="preload"
      as="style"
      data-promote-stylesheet
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Cal+Sans&family=DM+Sans:ital,opsz,wght@0,9..40,300..800;1,9..40,300..800&family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&family=Inter:opsz,wght@14..32,100..900&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>Neox</title>
    <style>
      /* Boot splash — shown while the JS bundle is parsing and React mounts.
         React's createRoot(...).render(...) wipes #root's children, so no teardown needed. */
      html,
      body {
        margin: 0;
        padding: 0;
        /* Prevent a white flash before the app's own styles load. */
        color-scheme: light dark;
      }
      /* Only `html`: an unlayered `body` background here would override the layered
         `body` rule in index.css that paints the whole-window glass coat. */
      html {
        background: transparent;
      }
      #root {
        min-height: 100vh;
      }
      .app-boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-app-region: drag;
        pointer-events: none;
      }
      .app-boot-splash__icon {
        /* The bare N-graph mark fills its viewBox, so it reads at a smaller size than a plated icon. */
        width: 72px;
        height: 72px;
        opacity: 0;
        transform: scale(0.96);
        animation:
          app-boot-splash-in 420ms ease-out forwards,
          app-boot-splash-pulse 2.4s ease-in-out 420ms infinite;
      }
      @keyframes app-boot-splash-in {
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes app-boot-splash-pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(0.98);
          opacity: 0.85;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-boot-splash__icon {
          animation: app-boot-splash-in 200ms ease-out forwards;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-boot-splash" aria-hidden="true">
        <img class="app-boot-splash__icon" src="/neolix-logo.svg" alt="" draggable="false" />
      </div>
    </div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
